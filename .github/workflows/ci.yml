name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unused files, exports and dependencies
        run: npm run knip
      - name: Production code that only its tests use
        run: npm run knip:production
      - name: Dependencies that cross a layer
        run: npm run layers
      - name: Duplication checks that are switched off
        run: npm run duplication:guard
      - name: Duplicated production code
        run: npm run duplication:production
      - name: New duplicated test code
        run: npm run duplication:tests
      - name: Surviving mutants in the changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run mutation:changed -- --base "$BASE_REF"
      - name: Test with coverage
        run: npm run test:coverage
      - name: SonarQube Cloud token available
        id: sonar-token
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SONAR_TOKEN is empty (pull request from a fork, or secret not set yet): the SonarQube Cloud analysis is skipped."
          fi
      - name: Analyse with SonarQube Cloud
        if: steps.sonar-token.outputs.present == 'true' && github.event.pull_request.head.repo.fork != true
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
