# SonarQube Cloud analysis of the hub, informative (decision #114). Run by the CI after `npm run test:coverage`.
sonar.organization=odehel
sonar.projectKey=ODehel_quiz-live-server

# The tests live next to the production code in `src`: Sonar wants disjoint sets, so the tests are taken out of the sources.
# This exclusion separates, it hides nothing: it must stay equal to `sonar.test.inclusions` (src/sonar-guard.test.ts).
# `src/test-support` holds the helpers the tests spawn (probes, a lock holder): they are tests, not production code.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,src/test-support/**
sonar.exclusions=**/*.test.ts,src/test-support/**

# Written by `npm run test:coverage` (Vitest, reporter `lcov`).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
